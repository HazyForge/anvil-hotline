name: security

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Weekly public-repo scan (uses free public Actions minutes).
    - cron: "17 6 * * 1"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan module and packages
        run: |
          govulncheck ./...
          govulncheck -mode=binary "$(go env GOPATH)/bin/govulncheck" || true
          go build -trimpath -o /tmp/anvil-hotline ./cmd/anvil-hotline
          govulncheck -mode=binary /tmp/anvil-hotline

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: -no-fail=false -fmt=sarif -out=gosec.sarif -exclude=G104 ./...
      - name: Upload gosec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go"

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  scorecard:
    name: openssf-scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: openssf-scorecard

  security-gate:
    name: security-gate
    needs: [govulncheck, gosec, codeql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require security jobs
        run: |
          set -euo pipefail
          for job in govulncheck gosec codeql; do
            result="${{ needs[job].result }}"
            echo "$job=$result"
            test "$result" = "success"
          done

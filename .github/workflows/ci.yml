name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -trimpath -o /tmp/anvil-hotline ./cmd/anvil-hotline

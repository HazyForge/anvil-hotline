# Anvil Primaris TestContract for anvil-hotline.
# Release gate requires the security suite so ApplicationRelease / anvilctl
# release flows fail closed without a green vuln + static analysis pass.
apiVersion: anvil.hazyforge.io/tests/v1alpha1
kind: TestContract
metadata:
  name: anvil-hotline
  namespace: anvilhub
  application: anvil-hotline
  labels:
    app.kubernetes.io/name: anvil-hotline
gates:
  release:
    suites:
      - unit
      - security
profiles:
  anvil-hotline:
    namespace: anvilhub
    workdir: /workspace/anvil-hotline
    repository:
      path: /workspace/anvil-hotline
    agentRefs:
      - id: z400-build-worker
      - id: acer-build-worker
suites:
  unit:
    profile: anvil-hotline
    timeoutSeconds: 900
    coverage:
      components:
        - anvil-hotline
      sources: [primary]
    lanes:
      - name: verify
        adapter: shell
        script: |
          make verify
  security:
    profile: anvil-hotline
    timeoutSeconds: 1800
    coverage:
      components:
        - anvil-hotline
      sources: [primary]
    lanes:
      - name: govulncheck-and-gosec
        adapter: shell
        script: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:${PATH}"
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          make security
      - name: binary-govulncheck
        adapter: shell
        script: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:${PATH}"
          make build
          govulncheck -mode=binary ./bin/anvil-hotline
